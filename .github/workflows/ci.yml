name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: printq
          POSTGRES_PASSWORD: printq
          POSTGRES_DB: printq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U printq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRINTQ_TEST_DATABASE_URL: postgres://printq:printq@localhost:5432/printq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://printq:printq@localhost:5432/printq_test
      - run: npm test

# Include inside the existing `server { ... }` block for csa.ufv.ca, BEFORE the
# catch-all `location /`. nginx's default client_max_body_size is 1m, which
# would reject G-code uploads. Adjust proxy_pass to match the existing upstream.
location = /api/printq/uploads {
    client_max_body_size 55m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

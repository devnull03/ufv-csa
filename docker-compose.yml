# The CSA site with PrintQ, plus its Postgres, for testing on your own machine.
#
#   cp .env.example .env      # then fill it in (see the comments there)
#   docker compose up --build # or: podman compose up --build
#   open http://localhost:3000/printing
#
# Services:
#   db       Postgres 16 (data in the "pgdata" volume)
#   migrate  one-shot: applies migrations, adds the printer and lab hours,
#            and demo data when PRINTQ_DEMO=true; then exits
#   web      the Next.js site (production build)
#   cron     calls PrintQ's scheduled jobs every 5 minutes (hold expiry,
#            reminders, upload cleanup, Discord board refresh)
# Full guide: docs/printq/DOCKER.md

name: ufv-csa

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-dummy000}
    NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
    NEXT_PUBLIC_PRINTQ_ENABLED: ${NEXT_PUBLIC_PRINTQ_ENABLED:-true}
    NEXT_PUBLIC_UMAMI_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_UMAMI_ANALYTICS_SITE_ID:-}
    SITE_DOMAIN: ${SITE_DOMAIN:-localhost:3000}

x-database-url: &database-url postgres://printq:${POSTGRES_PASSWORD:-printq}@db:5432/printq

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printq}
      POSTGRES_DB: printq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only on this machine, for psql / drizzle-kit studio. Change if 5432 is taken.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printq -d printq"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      <<: *build
      target: tools
    image: localhost/ufv-csa-tools:latest
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    command: ["sh", "deploy/docker/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      <<: *build
      target: runner
    image: localhost/ufv-csa-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      PRINTQ_UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    image: docker.io/curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$PRINTQ_CRON_SECRET" http://web:3000/api/printq/cron || echo "cron: web not ready yet"
          echo
          sleep 300
        done
    depends_on:
      - web

volumes:
  pgdata:
  uploads:

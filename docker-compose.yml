# The CSA site with PrintQ, plus its Postgres, for testing on your own machine.
#
#   cp .env.example .env          # then fill in the two REQUIRED secrets
#   docker compose up --build     # or: podman compose up --build
#   open http://localhost:3000/printing
#
# db   Postgres 16 (data in the "pgdata" volume)
# web  the site. On start it brings the database up to date (migrations,
#      printer, lab hours, demo data in demo mode) and runs PrintQ's
#      scheduled jobs every 5 minutes.
# Full guide: docs/printq/DOCKER.md

name: ufv-csa

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printq}
      POSTGRES_DB: printq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only on this machine, for psql. Change POSTGRES_PORT if 5432 is taken.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printq -d printq"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are baked into the build: rebuild after changing them.
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-dummy000}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
        NEXT_PUBLIC_PRINTQ_ENABLED: ${NEXT_PUBLIC_PRINTQ_ENABLED:-true}
        NEXT_PUBLIC_UMAMI_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_UMAMI_ANALYTICS_SITE_ID:-}
        SITE_DOMAIN: ${SITE_DOMAIN:-localhost:3000}
    image: localhost/ufv-csa-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://printq:${POSTGRES_PASSWORD:-printq}@db:5432/printq
      PRINTQ_UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
